kind = "web"
previewPath = "/"
title = "Doc of Detox Treatments"
version = "1.0.0"
id = "artifacts/dod-treatments"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 19787

[services.development]
run = "pnpm --filter @workspace/dod-treatments run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/dod-treatments", "run", "build" ]
serve = "static"
publicDir = "artifacts/dod-treatments/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19787"
BASE_PATH = "/"
